name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to build and publish
        required: true

permissions:
  contents: write

# Serialize releases so the tap update cannot race another release.
concurrency:
  group: murmur-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate version tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected vMAJOR.MINOR.PATCH" >&2; exit 1; }
          echo "MURMUR_VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: jdx/mise-action@v2
      - name: Test
        run: mise run test
      - name: Build and package
        run: |
          mise run package
          hdiutil verify dist/Murmur.dmg
          codesign --verify --deep --strict dist/Murmur.app
          file dist/Murmur.app/Contents/MacOS/Murmur
      - name: Publish GitHub release
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Murmur $TAG" --generate-notes
          fi
          if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == true ]]; then
            (cd dist && shasum -a 256 Murmur.dmg > Murmur.dmg.sha256)
            gh release upload "$TAG" dist/Murmur.dmg dist/Murmur.dmg.sha256 --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            # A rerun must pin the already-published bytes, not a new build.
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern Murmur.dmg --dir dist --clobber
          fi
          python3 script/update-cask.py "$TAG" dist/Murmur.dmg Casks/murmur.rb
          ruby -c Casks/murmur.rb
          cp Casks/murmur.rb "$RUNNER_TEMP/murmur.rb"
      - name: Check out tap branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: tap
      - name: Update Homebrew cask
        working-directory: tap
        run: |
          set -euo pipefail
          # Do not downgrade the tap when an older release is manually rerun.
          LATEST="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ "$LATEST" != "$TAG" ]]; then
            echo "Not the latest release; leaving the cask unchanged."
            exit 0
          fi
          cp "$RUNNER_TEMP/murmur.rb" Casks/murmur.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/murmur.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update Homebrew cask for $TAG"
            git push origin HEAD:main
          fi
