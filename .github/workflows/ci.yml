name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run test
      - name: Test cask updater
        run: python3 -m unittest discover -s Tests/Distribution -v
      - name: Verify release packaging
        run: |
          mise run package
          hdiutil verify dist/Murmur.dmg
          codesign --verify --deep --strict dist/Murmur.app
      - name: Validate cask syntax
        run: ruby -c Casks/murmur.rb
